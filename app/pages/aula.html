<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula — pense.ead</title>
  <link rel="stylesheet" href="../css/app.css" />
  <style>
    #player-wrapper { position: relative; padding-top: 56.25%; }
    #player-wrapper iframe, #player-wrapper #player {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 id="titulo-aula">Carregando aula...</h1>
      <div id="player-wrapper"><div id="player"></div></div>
      <p id="conteudo-texto"></p>
      <button class="botao" id="botao-concluir" style="margin-top:16px;">Marcar como concluída</button>
    </div>
  </div>

  <!-- YouTube IFrame Player API: necessária para detectar o fim do vídeo -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module">
    import { exigirLogin } from "../js/auth-guard.js";
    import { buscarAula } from "../js/api/cursos.js";
    import { marcarAulaConcluida } from "../js/api/progresso.js";

    await exigirLogin();

    const aulaId = new URLSearchParams(location.search).get("id");
    const aula = await buscarAula(aulaId); // RLS garante que só retorna se o aluno estiver matriculado
    document.getElementById("titulo-aula").textContent = aula.titulo;

    document.getElementById("botao-concluir").addEventListener("click", async () => {
      await marcarAulaConcluida(aula.id);
      alert("Aula marcada como concluída!");
    });

    if (aula.tipo === "video" && aula.youtube_video_id) {
      // onYouTubeIframeAPIReady é chamado automaticamente pelo script da API
      // acima assim que ele termina de carregar.
      window.onYouTubeIframeAPIReady = () => {
        new YT.Player("player", {
          videoId: aula.youtube_video_id,
          events: {
            onStateChange: async (evento) => {
              if (evento.data === YT.PlayerState.ENDED) {
                await marcarAulaConcluida(aula.id);
              }
            },
          },
        });
      };
    } else if (aula.tipo === "texto") {
      document.getElementById("player-wrapper").remove();
      document.getElementById("conteudo-texto").textContent = aula.conteudo_texto ?? "";
    }
  </script>
</body>
</html>
