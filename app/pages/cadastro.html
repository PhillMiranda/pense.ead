<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — pense.ead</title>
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="container" style="max-width: 420px;">
    <div class="card">
      <h1>Criar conta</h1>
      <form id="form-cadastro">
        <input class="campo" type="text" name="nome" placeholder="Nome completo" required />
        <input class="campo" type="email" name="email" placeholder="E-mail" required />
        <input class="campo" type="password" name="senha" placeholder="Senha (mín. 6 caracteres)" minlength="6" required />
        <p class="erro" id="mensagem-erro" hidden></p>
        <button class="botao" type="submit">Criar conta</button>
      </form>
      <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from "../js/supabaseClient.js";

    const form = document.getElementById("form-cadastro");
    const mensagemErro = document.getElementById("mensagem-erro");

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensagemErro.hidden = true;

      const dados = new FormData(form);
      const { error } = await supabase.auth.signUp({
        email: dados.get("email"),
        password: dados.get("senha"),
        options: { data: { nome: dados.get("nome") } },
      });

      if (error) {
        mensagemErro.textContent = error.message;
        mensagemErro.hidden = false;
        return;
      }

      location.href = "dashboard.html";
    });
  </script>
</body>
</html>
