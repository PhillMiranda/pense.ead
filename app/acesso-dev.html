<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso rápido — pense.ead</title>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Titillium Web", sans-serif;
      background: #050a30;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #0d1b4b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      color: #fff;
    }
    .card img { height: 48px; margin-bottom: 20px; }
    .card h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .card p  { font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-amarelo { background: #f5c400; color: #050a30; margin-bottom: 10px; }
    .btn-azul    { background: #3a9bdc; color: #fff; }
    .status {
      margin-top: 18px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.45);
      min-height: 20px;
    }
    .status.erro  { color: #ff6b6b; }
    .status.ok    { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <img src="../img/identidade_visual/icone_penseead.svg" alt="pense.ead" />
    <h1>Acesso Rápido</h1>
    <p>Entre como superusuário para testar o dashboard sem precisar de cadastro.</p>

    <button class="btn btn-amarelo" id="btn-super">
      Entrar como Superusuário
    </button>
    <button class="btn btn-azul" id="btn-dashboard" style="display:none">
      Ir para o Dashboard →
    </button>

    <p class="status" id="status"></p>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./js/config.js";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SUPER_EMAIL = "dev@pense.ead.app";
    const SUPER_SENHA = "PenseEAD@2025!";

    const btnSuper     = document.getElementById("btn-super");
    const btnDashboard = document.getElementById("btn-dashboard");
    const status       = document.getElementById("status");

    function setStatus(msg, tipo = "") {
      status.textContent = msg;
      status.className   = "status " + tipo;
    }

    // Verifica se já há sessão ativa
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      setStatus("Sessão ativa: " + session.user.email, "ok");
      btnDashboard.style.display = "block";
    }

    btnSuper.addEventListener("click", async () => {
      btnSuper.disabled = true;
      setStatus("Conectando...");

      // Tenta login direto
      let { data, error } = await supabase.auth.signInWithPassword({
        email: SUPER_EMAIL,
        password: SUPER_SENHA,
      });

      // Se não existe, cria o usuário
      if (error && error.message.includes("Invalid login credentials")) {
        setStatus("Criando superusuário...");
        const reg = await supabase.auth.signUp({
          email: SUPER_EMAIL,
          password: SUPER_SENHA,
          options: { data: { nome: "Dev Admin" } },
        });
        data  = reg.data;
        error = reg.error;

        if (!error) {
          // Faz login após cadastro
          const login = await supabase.auth.signInWithPassword({
            email: SUPER_EMAIL,
            password: SUPER_SENHA,
          });
          data  = login.data;
          error = login.error;
        }
      }

      if (error) {
        setStatus("Erro: " + error.message, "erro");
        btnSuper.disabled = false;
        return;
      }

      setStatus("Logado como " + data.user.email, "ok");
      btnDashboard.style.display = "block";
      btnSuper.style.display     = "none";
    });

    btnDashboard.addEventListener("click", () => {
      location.href = "pages/dashboard.html";
    });
  </script>
</body>
</html>
